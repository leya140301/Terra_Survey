<style>
/* Layout: one calm column, one card per step; a sprout in the header grows as the survey progresses */
:root {
  --bg: #edf3f0;
  --surface: #ffffff;
  --ink: #16302a;
  --muted: #587069;
  --line: #d2dfd9;
  --accent: #1e7656;
  --accent-ink: #ffffff;
  --sel: #e1f1e9;
  --sun: #e9a91f;
  --soil: #8a6a4a;
  --warn: #b3261e;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1916; --surface: #15231f; --ink: #e4efea; --muted: #9bb1aa; --line: #29403a;
    --accent: #4dbd8c; --accent-ink: #0a1612; --sel: #1b3a2e; --sun: #f0c04e; --soil: #b48d66; --warn: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1916; --surface: #15231f; --ink: #e4efea; --muted: #9bb1aa; --line: #29403a;
  --accent: #4dbd8c; --accent-ink: #0a1612; --sel: #1b3a2e; --sun: #f0c04e; --soil: #b48d66; --warn: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  display: flex; flex-direction: column; gap: 18px;
}
header.top { display: flex; align-items: center; gap: 14px; }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand .name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; }
.brand .part { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
.lang button {
  appearance: none; border: 0; background: transparent; color: var(--muted);
  font: 600 0.8rem var(--font-body); padding: 6px 12px; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.sprout { width: 44px; height: 44px; flex-shrink: 0; }
.sprout .soil { fill: var(--soil); }
.sprout .stem { stroke: var(--accent); }
.sprout .leaf { fill: var(--accent); transition: opacity .4s, transform .4s; transform-box: fill-box; }
.sprout .bloom { fill: var(--sun); transition: opacity .4s; }
.bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .4s ease; }
.preview-note {
  font-size: 0.82rem; color: var(--muted); border: 1px dashed var(--line);
  border-radius: 10px; padding: 8px 12px;
}
main { display: flex; flex-direction: column; gap: 16px; }
.intro h1, .section-head h2 {
  font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em;
  text-wrap: balance; margin: 0;
}
.intro h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.1; }
.intro p { margin: 0; max-width: 60ch; }
.intro { display: flex; flex-direction: column; gap: 14px; padding-block: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-size: 0.8rem; font-weight: 600; color: var(--accent);
  background: var(--sel); border-radius: 999px; padding: 4px 10px;
}
.section-head { display: flex; flex-direction: column; gap: 4px; }
.section-head .eyebrow { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
.section-head h2 { font-size: 1.6rem; line-height: 1.15; }
.section-head p { margin: 4px 0 0; color: var(--muted); }
.q {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; display: flex; flex-direction: column; gap: 12px; margin: 0; min-width: 0;
}
.q.invalid { border-color: var(--warn); }
.q legend, .q .qlabel { padding: 0; font-weight: 600; font-size: 1.02rem; line-height: 1.4; }
.q legend { float: left; width: 100%; margin-bottom: 12px; }
.q legend + * { clear: both; }
.q .num { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 4px; }
.q .hint { font-size: 0.85rem; color: var(--muted); margin-top: -4px; }
.q .err { font-size: 0.85rem; color: var(--warn); font-weight: 500; }
.opts { display: grid; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 12px; cursor: pointer;
  border: 1.5px solid var(--line); border-radius: 11px; padding: 11px 14px;
  background: var(--surface); transition: border-color .15s, background .15s;
}
.opt:hover { border-color: var(--accent); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt .mark {
  width: 20px; height: 20px; flex-shrink: 0; border: 2px solid var(--muted);
  display: grid; place-items: center; transition: all .15s;
}
.opt.radio .mark { border-radius: 50%; }
.opt.check .mark { border-radius: 6px; }
.opt .mark::after { content: ""; width: 8px; height: 8px; border-radius: inherit; background: var(--accent-ink); transform: scale(0); transition: transform .15s; }
.opt.check .mark::after { width: 10px; height: 6px; background: none; border: solid var(--accent-ink); border-width: 0 0 2.5px 2.5px; border-radius: 0; transform: rotate(-45deg) scale(0); margin-top: -3px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--sel); }
.opt:has(input:checked) .mark { background: var(--accent); border-color: var(--accent); }
.opt:has(input:checked) .mark::after { transform: scale(1); }
.opt.check:has(input:checked) .mark::after { transform: rotate(-45deg) scale(1); }
.opt:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.opt .txt { min-width: 0; }
.other-input { margin-top: -2px; }
input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 11px; padding: 11px 13px;
}
textarea { min-height: 96px; resize: vertical; }
input[type="text"]:focus, textarea:focus { outline: none; border-color: var(--accent); }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale label { position: relative; }
.scale input { position: absolute; opacity: 0; inset: 0; }
.scale span {
  display: grid; place-items: center; height: 50px; border-radius: 11px;
  border: 1.5px solid var(--line); font-family: var(--font-display); font-weight: 700; font-size: 1.15rem;
  cursor: pointer; font-variant-numeric: tabular-nums; transition: all .15s;
}
.scale label:hover span { border-color: var(--accent); }
.scale input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.scale input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.scale-ends { display: flex; justify-content: space-between; gap: 12px; font-size: 0.82rem; color: var(--muted); }
.scale-ends span:last-child { text-align: right; }
.roles { display: grid; gap: 10px; }
.role {
  appearance: none; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  display: flex; align-items: center; gap: 14px; background: var(--surface);
  border: 1.5px solid var(--line); border-radius: var(--radius); padding: 16px 18px;
  transition: border-color .15s, background .15s, transform .1s;
}
.role:hover { border-color: var(--accent); }
.role:active { transform: scale(0.99); }
.role[aria-pressed="true"] { border-color: var(--accent); background: var(--sel); }
.role:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.role svg { width: 34px; height: 34px; flex-shrink: 0; color: var(--accent); }
.role b { display: block; font-size: 1.05rem; }
.role small { color: var(--muted); font-size: 0.85rem; }
.app-image {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  overflow: hidden; display: flex; flex-direction: column;
}
.app-image img { display: block; width: 100%; height: auto; }
.app-image .ph {
  aspect-ratio: 16 / 10; max-width: 100%; display: grid; place-items: center; text-align: center;
  color: var(--muted); padding: 20px; background: var(--sel); font-size: 0.9rem;
}
.app-image figcaption { font-size: 0.85rem; color: var(--muted); padding: 10px 14px; }
.subblock { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; margin: 6px 0 -4px; }
nav.steps { display: flex; gap: 10px; justify-content: space-between; align-items: center; padding-top: 4px; }
.btn {
  appearance: none; font: 600 1rem var(--font-body); border-radius: 999px; cursor: pointer;
  padding: 13px 24px; border: 1.5px solid transparent; transition: filter .15s, background .15s;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--muted); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn.primary:only-child { margin-left: auto; }
.done { text-align: center; padding-block: 30px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.done svg { width: 120px; height: 120px; }
.done h1 { font-family: var(--font-display); font-size: 2rem; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.done p { margin: 0; color: var(--muted); max-width: 46ch; }
.send-error { color: var(--warn); font-size: 0.9rem; }
.anim-in { animation: rise .35s ease both; }
@keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
/* ---------- Auswertung (nur für das Team) ---------- */
.dash { display: flex; flex-direction: column; gap: 16px; }
.login { display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
.login .row { display: flex; gap: 8px; flex-wrap: wrap; }
.login .row input { flex: 1; min-width: 180px; }
.login .msg { color: var(--warn); font-size: 0.9rem; margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.tile b { display: block; font-family: var(--font-display); font-size: 1.7rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 0.8rem; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters button {
  appearance: none; font: 600 0.85rem var(--font-body); color: var(--ink); cursor: pointer;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 14px;
}
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.filters button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.dash-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.dash-actions a.btn { text-decoration: none; display: inline-block; }
.btn.small { padding: 9px 16px; font-size: 0.9rem; }
.res-n { font-size: 0.85rem; color: var(--muted); margin-top: -6px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: flex; flex-direction: column; gap: 4px; }
.bar-row .lbl { display: flex; justify-content: space-between; gap: 12px; font-size: 0.92rem; }
.bar-row .lbl span:first-child { min-width: 0; }
.bar-row .lbl span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-row .track { height: 10px; background: var(--sel); border-radius: 4px; overflow: hidden; }
.bar-row .track i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-row.zero .track i { min-width: 0; }
.avg { font-size: 0.92rem; }
.avg b { font-family: var(--font-display); font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.texts { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.texts li { background: var(--bg); border-radius: 10px; padding: 9px 12px; font-size: 0.92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.texts .tag { display: block; font-size: 0.75rem; color: var(--muted); }
.subtle { font-size: 0.85rem; color: var(--muted); margin: 0; }
.linkish { appearance: none; background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
</style>

    var v = state.a[id];
    if (q.type === 'check') v = (v || []).join(' | ');
    if (v !== undefined && v !== null && v !== '') answers[h] = v;
    if (hasOther) {
      var picked = q.type === 'check' ? (state.a[id] || []).indexOf('Anderes') !== -1 : state.a[id] === 'Anderes';
      if (picked && state.a[id + '_other']) answers[ho] = state.a[id + '_other'];
    }
  });
  return { lang: state.lang, headers: headers, answers: answers };
}

function submit(btn) {
  var payload = buildPayload();
  btn.disabled = true; btn.textContent = t('sending');
  var oldErr = document.querySelector('.send-error'); if (oldErr) oldErr.remove();
  var send = IN_APPS_SCRIPT
    ? new Promise(function (res, rej) { google.script.run.withSuccessHandler(res).withFailureHandler(rej).submitResponse(payload); })
    : new Promise(function (res) { console.log('Vorschau – Antwort:', payload); setTimeout(res, 500); });
  send.then(function () {
    state = { lang: state.lang, page: 'done', a: {} };
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    render(); window.scrollTo(0, 0);
  }, function () {
    btn.disabled = false; btn.textContent = t('submit');
    btn.closest('nav').insertAdjacentElement('afterend', el('p', { class: 'send-error', role: 'alert', text: t('sendErr') }));
  });
}

/* ---------- Sprache ---------- */
document.getElementById('langDe').addEventListener('click', function () { state.lang = 'de'; persist(); render(); });
document.getElementById('langEn').addEventListener('click', function () { state.lang = 'en'; persist(); render(); });

/* ============================================================
   AUSWERTUNG (nur für das Team)
   Aufruf: Web-App-Link + ?auswertung   (z. B. …/exec?auswertung)
   Passwort steht in Code.gs (ADMIN_PASSWORD).
   ============================================================ */
var admin = { rows: [], filter: 'all', demo: false, sheetUrl: '', pw: '' };
var ROLE_FILTERS = [
  { k: 'all', label: 'Alle' },
  { k: 'Schüler/in', label: 'Schüler/innen' },
  { k: 'Student/in', label: 'Studierende' },
  { k: 'Elternteil', label: 'Eltern' }
];
function textHeader(id) { return headerFor(id) + (Q[id].type === 'text' ? ' [Text]' : ''); }
function otherHeader(id) { return 'Q' + Q[id].n + ' Anderes (Text) [Text]'; }

function startAdmin() {
  document.title = 'Auswertung Study Terra';
  document.querySelector('.lang').hidden = true;
  document.querySelector('.bar').hidden = true;
  document.getElementById('previewNote').hidden = true;
  document.getElementById('partLabel').textContent = 'Auswertung';
  ['leaf1', 'leaf2', 'leaf3', 'bloom'].forEach(function (id) { document.getElementById(id).setAttribute('opacity', '1'); });
  document.getElementById('stem').setAttribute('y2', '10');
  if (!IN_APPS_SCRIPT) { admin.demo = true; admin.rows = demoRows(60); renderDash(); return; }
  renderLogin('');
}

function renderLogin(msg) {
  var app = document.getElementById('app'); app.innerHTML = '';
  var input = el('input', { type: 'password', id: 'adminPw', autocomplete: 'current-password', placeholder: 'Passwort' });
  var btn = el('button', { class: 'btn primary small', type: 'submit', text: 'Ergebnisse anzeigen' });
  var form = el('form', { class: 'login' }, [
    el('div', { class: 'section-head' }, [el('span', { class: 'eyebrow', text: 'Nur für das Team' }), el('h2', { text: 'Auswertung' }),
      el('p', { text: 'Gib das Passwort ein, das in Code.gs bei ADMIN_PASSWORD steht.' })]),
    el('label', { for: 'adminPw', class: 'qlabel', text: 'Passwort' }),
    el('div', { class: 'row' }, [input, btn]),
    msg ? el('p', { class: 'msg', role: 'alert', text: msg }) : null
  ]);
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true; btn.textContent = 'Wird geladen …';
    loadResults(input.value, function (err) { renderLogin(err); });
  });
  app.appendChild(form);
  input.focus();
}

function loadResults(pw, onError) {
  google.script.run
    .withSuccessHandler(function (res) { admin.pw = pw; admin.rows = res.rows || []; admin.sheetUrl = res.sheetUrl || ''; renderDash(); })
    .withFailureHandler(function (err) {
      var m = String(err && err.message || err);
      onError(m.indexOf('wrong_password') !== -1 ? 'Das Passwort stimmt nicht.'
        : m.indexOf('not_configured') !== -1 ? 'In Code.gs ist noch kein Passwort gesetzt (ADMIN_PASSWORD).'
        : 'Die Ergebnisse konnten nicht geladen werden: ' + m);
    })
    .getResults(pw);
}

function filteredRows() {
  return admin.filter === 'all' ? admin.rows : admin.rows.filter(function (r) { return r[textHeader('q1')] === admin.filter; });
}

function renderDash() {
  var app = document.getElementById('app'); app.innerHTML = '';
  var dash = el('div', { class: 'dash' });
  dash.appendChild(el('div', { class: 'section-head' }, [
    el('span', { class: 'eyebrow', text: admin.demo ? 'Vorschau mit Beispieldaten' : 'Nur für das Team' }),
    el('h2', { text: 'Auswertung' }),
    admin.demo ? el('p', { text: 'Das sind erfundene Beispieldaten, damit ihr seht, wie die Auswertung aussieht. In der echten Web-App stehen hier eure Antworten.' }) : null
  ]));

  var all = admin.rows, count = function (v) { return all.filter(function (r) { return r[textHeader('q1')] === v; }).length; };
  dash.appendChild(el('div', { class: 'tiles' }, [
    tile(all.length, 'Antworten gesamt'), tile(count('Schüler/in'), 'Schüler/innen'),
    tile(count('Student/in'), 'Studierende'), tile(count('Elternteil'), 'Eltern')
  ]));

  var filters = el('div', { class: 'filters', role: 'group', 'aria-label': 'Nach Gruppe filtern' });
  ROLE_FILTERS.forEach(function (f) {
    filters.appendChild(el('button', { type: 'button', 'aria-pressed': String(admin.filter === f.k), text: f.label,
      onclick: function () { admin.filter = f.k; renderDash(); } }));
  });
  dash.appendChild(filters);

  var actions = el('div', { class: 'dash-actions' });
  if (!admin.demo) {
    var refresh = el('button', { class: 'btn ghost small', type: 'button', text: 'Aktualisieren', onclick: function () {
      refresh.disabled = true; refresh.textContent = 'Wird geladen …';
      loadResults(admin.pw, function (err) { refresh.disabled = false; refresh.textContent = 'Aktualisieren'; alertMsg(err); });
    } });
    actions.appendChild(refresh);
    if (admin.sheetUrl) actions.appendChild(el('a', { class: 'btn ghost small', href: admin.sheetUrl, target: '_blank', rel: 'noopener', text: 'Google-Tabelle öffnen' }));
  }
  if (actions.childNodes.length) dash.appendChild(actions);

  var rows = filteredRows();
  if (!rows.length) {
    dash.appendChild(el('p', { class: 'subtle', text: all.length ? 'In dieser Gruppe gibt es noch keine Antworten.' : 'Noch keine Antworten. Sobald jemand die Umfrage abschickt, erscheint sie hier.' }));
  }
  Q_ORDER.forEach(function (id) {
    if (id === 'q1' && admin.filter !== 'all') return;
    var card = resultCard(id, rows);
    if (card) dash.appendChild(card);
  });
  app.appendChild(dash);
}

function alertMsg(m) { var d = document.querySelector('.dash'); if (d) d.insertBefore(el('p', { class: 'send-error', role: 'alert', text: m }), d.children[2]); }
function tile(n, label) { return el('div', { class: 'tile' }, [el('b', { text: String(n) }), el('span', { text: label })]); }

function resultCard(id, rows) {
  var q = Q[id], h = textHeader(id);
  var vals = rows.map(function (r) { return r[h]; }).filter(function (v) { return v !== undefined && v !== null && String(v) !== ''; });
  var others = rows.map(function (r) { return r[otherHeader(id)]; }).filter(function (v) { return v; });
  if (!vals.length) return null;
  var box = el('section', { class: 'q' });
  box.appendChild(el('div', { class: 'qlabel' }, [el('span', { class: 'num', text: q.n + '.' }), q.de]));
  var nLabel = vals.length + (vals.length === 1 ? ' Antwort' : ' Antworten') + (q.type === 'check' ? ' · Mehrfachauswahl, Prozent je Person' : '');
  box.appendChild(el('div', { class: 'res-n', text: nLabel }));

  if (q.type === 'text') {
    box.appendChild(textList(vals.slice().reverse()));
    return box;
  }
  var counts = {};
  vals.forEach(function (v) { String(v).split(' | ').forEach(function (p) { p = p.trim(); if (p) counts[p] = (counts[p] || 0) + 1; }); });
  var keys = q.type === 'scale' ? ['1', '2', '3', '4', '5'] : q.options.map(function (op) { return op.v; });
  Object.keys(counts).forEach(function (k) { if (keys.indexOf(k) === -1) keys.push(k); });
  var max = Math.max.apply(null, keys.map(function (k) { return counts[k] || 0; }).concat([1]));
  var bars = el('div', { class: 'bars' });
  keys.forEach(function (k) {
    var c = counts[k] || 0, pct = Math.round(c / vals.length * 100);
    var label = q.type === 'scale' ? k + (k === '1' ? ' = ' + q.min.de : k === '5' ? ' = ' + q.max.de : '') : k;
    var row = el('div', { class: 'bar-row' + (c ? '' : ' zero'), title: label + ': ' + c + ' (' + pct + ' %)' }, [
      el('div', { class: 'lbl' }, [el('span', { text: label }), el('span', { text: c + ' · ' + pct + ' %' })]),
      el('div', { class: 'track' }, [el('i', { style: 'width:' + (c / max * 100) + '%' })])
    ]);
    bars.appendChild(row);
  });
  box.appendChild(bars);
  if (q.type === 'scale') {
    var sum = vals.reduce(function (s, v) { return s + Number(v); }, 0);
    box.appendChild(el('div', { class: 'avg' }, ['Durchschnitt: ', el('b', { text: (sum / vals.length).toFixed(1).replace('.', ',') }), ' von 5']));
  }
  if (others.length) {
    box.appendChild(el('div', { class: 'res-n', text: 'Angaben bei „Anderes“:' }));
    box.appendChild(textList(others.slice().reverse()));
  }
  return box;
}

function textList(items) {
  var LIMIT = 5, ul = el('ul', { class: 'texts' });
  items.forEach(function (v, i) { var li = el('li', { text: String(v) }); li.hidden = i >= LIMIT; ul.appendChild(li); });
  if (items.length <= LIMIT) return ul;
  var wrap = el('div', { style: 'display:flex;flex-direction:column;gap:8px' }, [ul]);
  var more = el('button', { class: 'linkish', type: 'button', text: 'Alle ' + items.length + ' anzeigen', onclick: function () {
    ul.querySelectorAll('li').forEach(function (li) { li.hidden = false; }); more.remove();
  } });
  wrap.appendChild(more);
  return wrap;
}

/* Beispieldaten nur für die Vorschau außerhalb von Google */
function demoRows(n) {
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
  var texts = ['Beispielantwort: zu viele Mitteilungen', 'Beispielantwort: wenn es Geld kostet', 'Beispielantwort: Quizlet', 'Beispielantwort: mehr Tiere in der Welt', 'Beispielantwort: Datenschutz'];
  var out = [];
  for (var i = 0; i < n; i++) {
    var a = { q1: pick(['Schüler/in', 'Schüler/in', 'Student/in', 'Elternteil']) };
    withAnswers(a, function () {
      visiblePages().forEach(function (p) {
        qsOf(p).forEach(function (id) {
          var q = Q[id];
          if (id === 'q1') return;
          if (q.type === 'scale') a[id] = 1 + Math.floor(rnd() * 5);
          else if (q.type === 'text') { if (rnd() < 0.4) a[id] = pick(texts); }
          else {
            var opts = q.options.filter(function (op) { return !op.roles || op.roles.indexOf(role(a)) !== -1; });
            if (q.type === 'radio') a[id] = pick(opts).v;
            else a[id] = opts.filter(function () { return rnd() < 0.35; }).map(function (op) { return op.v; }).slice(0, 3);
            if (q.type === 'check' && !a[id].length) a[id] = [opts[0].v];
          }
        });
      });
      out.push(buildPayload().answers);
    });
  }
  return out;
}

/* ---------- Start ---------- */
if (IN_APPS_SCRIPT && google.script.url) {
  google.script.url.getLocation(function (loc) {
    if (loc && loc.parameter && 'auswertung' in loc.parameter) startAdmin(); else render();
  });
} else if (location.hash === '#auswertung') {
  startAdmin();
} else {
  render();
}
window.addEventListener('hashchange', function () { if (!IN_APPS_SCRIPT) { if (location.hash === '#auswertung') startAdmin(); else location.reload(); } });
</script>
